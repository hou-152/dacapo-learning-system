<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DaCapo 学习中心</title>
    <style>
        :root {
            --bg-deep: #0A0D12;
            --bg-elevated: #161D2B;
            --accent: #38BDF8;
            --accent-muted: #6EE7B7;
            --text-primary: #E5E7EB;
            --text-secondary: #9CA3AF;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: linear-gradient(135deg, var(--bg-deep) 0%, var(--bg-elevated) 100%);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        
        .container {
            max-width: 800px;
            text-align: center;
        }
        
        h1 {
            font-size: clamp(2.5rem, 6vw, 4rem);
            font-weight: 700;
            letter-spacing: -0.03em;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-muted) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .subtitle {
            color: var(--text-secondary);
            font-size: 1.125rem;
            margin-bottom: 3rem;
        }
        
        .buttons {
            display: grid;
            gap: 1.5rem;
            margin-bottom: 3rem;
        }
        
        .btn {
            display: block;
            padding: 1.5rem 2rem;
            background: var(--bg-elevated);
            border: 2px solid rgba(56, 189, 248, 0.3);
            border-radius: 16px;
            color: var(--text-primary);
            text-decoration: none;
            font-size: 1.125rem;
            font-weight: 600;
            transition: all 0.2s;
        }
        
        .btn:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(56, 189, 248, 0.2);
        }
        
        .btn-primary {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
        }
        
        .btn-primary:hover {
            background: var(--accent-muted);
            border-color: var(--accent-muted);
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            padding: 2rem;
            background: var(--bg-elevated);
            border-radius: 16px;
            border: 1px solid rgba(56, 189, 248, 0.1);
        }
        
        .stat {
            text-align: center;
        }
        
        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 0.25rem;
        }
        
        .stat-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
    </style>
    <script>
        // 动态加载数据
        async function loadStats() {
            try {
                const response = await fetch('../.learning-progress/mastery.json');
                const data = await response.json();
                
                const concepts = Object.values(data);
                const total = concepts.length;
                const avgMastery = (concepts.reduce((sum, c) => sum + c.score, 0) / total * 100).toFixed(1);
                
                document.getElementById('total-concepts').textContent = total;
                document.getElementById('avg-mastery').textContent = avgMastery + '%';
            } catch (e) {
                console.log('使用静态数据');
            }
        }
        
        window.addEventListener('DOMContentLoaded', loadStats);
    </script>
</head>
<body>
    <div class="container">
        <h1>🎓 DaCapo 学习中心</h1>
        <p class="subtitle">自适应学习系统 · 让学习上瘾</p>
        
        <div class="stats">
            <div class="stat">
                <div class="stat-value" id="total-concepts">18</div>
                <div class="stat-label">已掌握概念</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="avg-mastery">65.3%</div>
                <div class="stat-label">平均掌握度</div>
            </div>
            <div class="stat">
                <div class="stat-value">243</div>
                <div class="stat-label">概念关联</div>
            </div>
            <div class="stat">
                <div class="stat-value">1599.7</div>
                <div class="stat-label">复利指数</div>
            </div>
        </div>
        
        <div class="buttons">
            <a href="network.html" class="btn btn-primary">🕸️ 概念网络图</a>
            <a href="progress.html" class="btn">📊 学习进度仪表盘</a>
            <a href="../concepts/" class="btn">📚 概念库</a>
        </div>
    </div>
</body>
</html>
